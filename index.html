<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivynnio's Territory</title>
    <link rel="icon" href="johan.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0d0d0d;
            --bg-tertiary: #161616;
            --bg-card: rgba(18, 18, 18, 0.75);
            --text-primary: #ffffff;
            --text-secondary: #b8b8b8;
            --text-muted: #777777;
            --accent: #e74c3c;
            --accent-hover: #ff5a4a;
            --accent-glow: rgba(231, 76, 60, 0.45);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px var(--accent-glow);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== Loading ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            margin-top: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Navbar ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 2rem;
            background: rgba(8, 8, 8, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
        }
        .navbar.scrolled {
            background: rgba(5, 5, 5, 0.92);
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #ff8a7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo-text:hover {
            transform: scale(1.05);
        }
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        .navbar-end {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .theme-selector {
            display: flex;
            gap: 0.4rem;
        }
        .theme-color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        .theme-color:hover {
            transform: scale(1.2);
        }
        .theme-color.active {
            border-color: #fff;
            box-shadow: 0 0 10px currentColor;
        }
        .lang-toggle, .sound-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .lang-toggle:hover, .sound-toggle:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== Hero ===== */
        .main-content {
            padding-top: 90px;
        }
        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .particles-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.35;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
        .hero-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(231,76,60,0.2);
            margin-bottom: 1.8rem;
            transition: var(--transition);
            position: relative;
            z-index: 2;
        }
        .hero-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px var(--accent-glow), 0 0 100px rgba(231,76,60,0.35);
        }
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 2;
            letter-spacing: -0.02em;
        }
        .hero-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2.2rem;
            min-height: 1.6em;
            position: relative;
            z-index: 2;
        }
        .animated-text {
            color: var(--accent);
            font-weight: 500;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        .social-links {
            display: flex;
            gap: 1rem;
            position: relative;
            z-index: 2;
        }
        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
            backdrop-filter: blur(10px);
            text-decoration: none;
        }
        .social-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }
        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ===== Sections ===== */
        .section {
            padding: 5rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0.8rem auto 0;
            border-radius: 2px;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ===== Projects ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(231, 76, 60, 0.35);
            box-shadow: var(--shadow-glow);
        }
        .project-card:hover::before {
            opacity: 1;
        }
        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .project-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }
        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            background: rgba(231, 76, 60, 0.12);
            color: var(--accent);
            border-radius: 20px;
            border: 1px solid rgba(231, 76, 60, 0.25);
        }

        /* ===== SteamU ===== */
        .steamu-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .steamu-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .steamu-subtitle {
            color: var(--text-secondary);
        }
        .steamu-plans {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .steamu-plan {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem 1.6rem;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .steamu-plan:hover {
            transform: translateY(-6px);
            border-color: rgba(231, 76, 60, 0.4);
            box-shadow: var(--shadow-glow);
        }
        .steamu-plan-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .steamu-plan-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1.2rem;
        }
        .steamu-plan-features {
            list-style: none;
            margin-bottom: 1.5rem;
            flex: 1;
        }
        .steamu-plan-feature {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 0.7rem;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .steamu-plan-feature-icon {
            color: var(--accent);
            flex-shrink: 0;
        }
        .steamu-plan-lifetime {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
        }
        .steamu-plan-button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .steamu-plan-button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        /* ===== Tutorial ===== */
        .tutorial-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.4rem 1.6rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .tutorial-item:hover {
            border-color: rgba(231, 76, 60, 0.3);
        }
        .tutorial-item-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .tutorial-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(231, 76, 60, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .tutorial-item-title {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .tutorial-item-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .tutorial-button {
            margin-top: 0.9rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .tutorial-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .tutorial-details {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .tutorial-details.open {
            display: block;
        }
        .tutorial-content-text {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 0.8rem;
        }
        .tutorial-steps {
            padding-left: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .tutorial-steps li {
            margin-bottom: 0.4rem;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 2.5rem 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.9rem 1rem;
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .nav-menu {
                gap: 1.2rem;
                font-size: 0.9rem;
            }
            .theme-selector {
                display: none;
            }
            .hero {
                min-height: 75vh;
                padding: 3rem 1rem;
            }
            .hero-avatar {
                width: 110px;
                height: 110px;
            }
            .section {
                padding: 3.5rem 1rem;
            }
            .steamu-plans {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            .nav-menu {
                gap: 0.9rem;
            }
            .nav-link {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <div id="app">
        <nav class="navbar" id="navbar">
            <div class="logo" onclick="playClickSound(); window.scrollTo({top:0,behavior:'smooth'})">
                <span class="logo-text">Ivynnio</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link active" data-en="Home" data-id="Beranda" onclick="playClickSound()">Home</a></li>
                <li><a href="#projects" class="nav-link" data-en="Projects" data-id="Projects" onclick="playClickSound()">Projects</a></li>
                <li><a href="#steamu" class="nav-link" data-en="SteamU" data-id="SteamU" onclick="playClickSound()">SteamU</a></li>
                <li><a href="#tutorial" class="nav-link" data-en="Tutorial" data-id="Tutorial" onclick="playClickSound()">Tutorial</a></li>
            </ul>
            <div class="navbar-end">
                <div class="theme-selector">
                    <div class="theme-color active" style="background:#e74c3c" data-color="#e74c3c" onclick="changeTheme('#e74c3c');playClickSound()"></div>
                    <div class="theme-color" style="background:#3498db" data-color="#3498db" onclick="changeTheme('#3498db');playClickSound()"></div>
                    <div class="theme-color" style="background:#2ecc71" data-color="#2ecc71" onclick="changeTheme('#2ecc71');playClickSound()"></div>
                    <div class="theme-color" style="background:#9b59b6" data-color="#9b59b6" onclick="changeTheme('#9b59b6');playClickSound()"></div>
                    <div class="theme-color" style="background:#f39c12" data-color="#f39c12" onclick="changeTheme('#f39c12');playClickSound()"></div>
