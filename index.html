        .section-title::after {

        .project-card {

            border-radius: var(--radius);

            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .project-card::before {

            left: 0;

            height: 2px;

            opacity: 0;
            transition: opacity 0.3s;
        }

            transform: translateY(-6px);

            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            background: rgba(231, 76, 60, 0.12);
            color: var(--accent);
            border-radius: 20px;
            border: 1px solid rgba(231, 76, 60, 0.25);
        }

        /* ===== SteamU ===== */
        .steamu-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .steamu-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .steamu-subtitle {
            color: var(--text-secondary);
        }
        .steamu-plans {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .steamu-plan {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem 1.6rem;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .steamu-plan:hover {
            transform: translateY(-6px);
            border-color: rgba(231, 76, 60, 0.4);
            box-shadow: var(--shadow-glow);
        }
        .steamu-plan-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .steamu-plan-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1.2rem;
        }
        .steamu-plan-features {
            list-style: none;
            margin-bottom: 1.5rem;
            flex: 1;
        }
        .steamu-plan-feature {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 0.7rem;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .steamu-plan-feature-icon {
            color: var(--accent);
            flex-shrink: 0;
        }
        .steamu-plan-lifetime {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
        }
        .steamu-plan-button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .steamu-plan-button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        /* ===== Tutorial ===== */
        .tutorial-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.4rem 1.6rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .tutorial-item:hover {
            border-color: rgba(231, 76, 60, 0.3);
        }
        .tutorial-item-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .tutorial-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(231, 76, 60, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .tutorial-item-title {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .tutorial-item-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .tutorial-button {
            margin-top: 0.9rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .tutorial-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .tutorial-details {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .tutorial-details.open {
            display: block;
        }
        .tutorial-content-text {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 0.8rem;
        }
        .tutorial-steps {
            padding-left: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .tutorial-steps li {
            margin-bottom: 0.4rem;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 2.5rem 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.9rem 1rem;
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .nav-menu {
                gap: 1.2rem;
                font-size: 0.9rem;
            }
            .theme-selector {
                display: none;
            }
            .hero {
                min-height: 75vh;
                padding: 3rem 1rem;
            }
            .hero-avatar {
                width: 110px;
                height: 110px;
            }
            .section {
                padding: 3.5rem 1rem;
            }
            .steamu-plans {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            .nav-menu {
                gap: 0.9rem;
            }
            .nav-link {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
